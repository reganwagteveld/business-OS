; Transaction-mode pooler for the RLS spike and isolation tests (docs/data-model.md §5.4).
; Mirrors the production pooler's mode (Neon's pooled endpoint is PgBouncer in transaction mode).
; Development and CI only. Run from this directory: pgbouncer -d pgbouncer.ini
[databases]
business_os_spike = host=127.0.0.1 port=5432 dbname=business_os_spike
; One server connection only: proves no carry-over between pooled uses (S4, S5, S10).
spike_single = host=127.0.0.1 port=5432 dbname=business_os_spike pool_size=1

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6433
auth_type = scram-sha-256
auth_file = userlist.txt
pool_mode = transaction
default_pool_size = 5
max_client_conn = 200
; Prepared statements: left at the installed version's default on purpose (spike S12).
logfile = /tmp/pgbouncer-spike.log
pidfile = /tmp/pgbouncer-spike.pid
