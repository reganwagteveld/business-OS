<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Business OS</title>
    <script src="/theme-boot.js"></script>
  </head>
  <body>
    <div id="root">
      <!-- First paint before the app loads: never a blank window. Replaced when the app mounts. -->
      <style>
        /* Splash colours are the V2 tokens (packages/ui/src/styles.css: --bg-canvas, --fg-default, --fg-muted);
           packages/ui/tests/splash.test.ts keeps them in step. */
        html{background:#f7f7fb}
        .bos-boot{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7fb;color:#10142e}
        .bos-boot small{font-size:.75rem;letter-spacing:.22em;text-transform:uppercase;color:#555a77}
        .bos-boot span{color:#555a77}
        @media (prefers-color-scheme:dark){html:not(.light),html:not(.light) .bos-boot{background:#0b0f1e;color:#eef0fa}html:not(.light) .bos-boot small,html:not(.light) .bos-boot span{color:#a6abc6}}
        html.dark,html.dark .bos-boot{background:#0b0f1e;color:#eef0fa}html.dark .bos-boot small,html.dark .bos-boot span{color:#a6abc6}
      </style>
      <div class="bos-boot" role="status" aria-live="polite">
        <svg width="72" height="72" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="12" fill="#0B0B14"/><rect x="12" y="12" width="18" height="18" rx="4" fill="#8D7BFF"/><rect x="34" y="12" width="18" height="18" rx="4" fill="#FFD93B"/><rect x="12" y="34" width="18" height="18" rx="4" fill="#F0F1F6"/><rect x="34" y="34" width="18" height="18" rx="4" fill="#40404F"/></svg>
        <strong style="font-size:1.75rem;letter-spacing:-.02em">Business OS</strong>
        <small>Powered by Pixakova</small>
        <span style="margin-top:1.5rem;font-size:.875rem">Starting Business OS…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
