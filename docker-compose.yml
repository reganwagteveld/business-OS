services:
  postgres:
    image: postgres:16.10
    restart: unless-stopped
    environment:
      POSTGRES_DB: business_os
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_postgres_only
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d business_os']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
