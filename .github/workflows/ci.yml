name: CI
on:
  pull_request:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  # Full validation on demand (any branch): Actions → CI → Run workflow.
  workflow_dispatch:
  # Called by the nightly workflow (CI-2B); the event there is schedule or workflow_dispatch, so the full tier runs.
  workflow_call:
  # Weekly full run on main so toolchain drift (Rust stable, runner images) shows up before a release.
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

# Pull requests: a new commit cancels the superseded run for the same PR only.
# Everything else (main, release branches, tags, manual and scheduled runs) gets a group of its own,
# so one validation run can never cancel or queue behind another.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PGBOUNCER_VERSION: 1.22.0-1build4

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      desktop: ${{ steps.classify.outputs.desktop }}
      tier: ${{ steps.classify.outputs.tier }}
      desktop_reason: ${{ steps.classify.outputs.desktop_reason }}
      # CIQ-A1: which gated jobs run (docs, client or full). Separate from the CI-2A desktop decision.
      gate_tier: ${{ steps.gate-tier.outputs.gate_tier }}
      gate_reason: ${{ steps.gate-tier.outputs.gate_reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull_request checkout is the merge commit; its first parent is the current base tip.
          fetch-depth: 2
          persist-credentials: false
      - name: Self-test the change classifier and the gate verdict
        run: |
          .github/scripts/classify-changes.test.sh
          .github/scripts/classify-gate-tier.test.sh
          .github/scripts/scan-doc-credentials.test.sh
          .github/scripts/doc-credential-gate.test.sh
          .github/scripts/ci-gate.test.sh
          .github/scripts/db-shard-completeness.test.sh
          .github/scripts/changed-files.test.sh
          .github/scripts/check-migration-order.test.sh
          .github/scripts/release-gate.test.sh
          .github/scripts/release-resolve.test.sh
          .github/scripts/release-nightly-status.test.sh
          .github/scripts/release-workflow-guard.test.sh
      # STAB-01: a new migration must sort after every migration already on the base branch, or a
      # fresh database would apply it in a different order than production (docs/migration-readiness.md §4).
      - name: New migrations sort after the base branch's newest
        if: github.event_name == 'pull_request'
        run: |
          list() { git ls-tree --name-only "$1" apps/api/prisma/migrations/ | xargs -r -n1 basename; }
          list HEAD^1 > "$RUNNER_TEMP/base-migrations"
          list HEAD > "$RUNNER_TEMP/head-migrations"
          .github/scripts/check-migration-order.sh "$RUNNER_TEMP/base-migrations" "$RUNNER_TEMP/head-migrations"
      # CI-2A: the native matrix is skipped only for documentation-only changes (and, on pull requests,
      # API/web-only source). Every failure to establish the diff selects the full tier.
      - name: Decide whether the desktop matrix is needed
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          REF: ${{ github.ref }}
        run: |
          full() {
            echo "desktop=true"
            echo "tier=full"
            echo "desktop_reason=$1"
          }
          {
            if [ "$EVENT_NAME" != pull_request ] && [ "$EVENT_NAME" != push ]; then
              full "full validation for $EVENT_NAME on $REF"
            elif ! .github/scripts/changed-files.sh > "$RUNNER_TEMP/changed-files" 2> "$RUNNER_TEMP/changed-files.err"; then
              cat "$RUNNER_TEMP/changed-files.err" >&2
              full "changed files could not be established (fail closed): $(head -c 120 "$RUNNER_TEMP/changed-files.err" | tr '\n' ' ')"
            else
              tr '\0' '\n' < "$RUNNER_TEMP/changed-files" >&2
              .github/scripts/classify-changes.sh < "$RUNNER_TEMP/changed-files" || full "classifier failed (fail closed)"
            fi
          } | tee -a "$GITHUB_OUTPUT"
      # CIQ-A1 (docs/ci.md "Gate tiers"): docs skips static, unit, build and database; client skips only
      # database; everything else is full. Any failure to establish or classify the diff selects full.
      - name: Decide which gated jobs are needed
        id: gate-tier
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          GATE_REF: ${{ github.ref }}
        run: |
          full() {
            echo "gate_tier=full"
            echo "gate_reason=$1"
          }
          {
            if [ "$EVENT_NAME" != pull_request ] && [ "$EVENT_NAME" != push ]; then
              full "full validation for $EVENT_NAME on $GATE_REF"
            elif ! .github/scripts/changed-files.sh > "$RUNNER_TEMP/gate-files" 2> "$RUNNER_TEMP/gate-files.err"; then
              full "changed files could not be established (fail closed): $(head -c 120 "$RUNNER_TEMP/gate-files.err" | tr '\n' ' ')"
            elif ! out="$(.github/scripts/classify-gate-tier.sh < "$RUNNER_TEMP/gate-files")"; then
              full "gate tier classifier failed (fail closed)"
            else
              echo "$out"
            fi
          } | tee -a "$GITHUB_OUTPUT"
      # Every tier, every event: documentation must not contain credentials. A pull request is scanned
      # over its whole change (merge commit against the base tip, every PR commit included); a
      # single-step push over that step; anything else scans every documentation file at HEAD.
      # Never skipped (doc-credential-gate.sh).
      - name: Added documentation lines contain no credentials
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/doc-credential-gate.sh

  # CIQ-A1: static, unit and build are skipped only for the docs tier; database also for the client tier.
  # The conditions are "run unless the classifier explicitly said otherwise", so an empty or unknown
  # tier runs the job. If Detect changes fails, these jobs are skipped and CI gate fails on its result.
  static:
    name: Static checks (contracts, types, lint, boundaries)
    needs: changes
    if: needs.changes.outputs.gate_tier != 'docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env: &workspace-env
      # CI-only credentials, matching docker/init/01-roles.sql. Never used outside CI.
      # Server variables are read only by apps/api; the clients receive VITE_API_BASE_URL alone.
      DATABASE_URL: postgresql://bos_app:bos_local_app_password@localhost:5432/business_os?schema=public
      MIGRATION_DATABASE_URL: postgresql://bos_owner:bos_local_owner_password@localhost:5432/business_os?schema=public
      SHADOW_DATABASE_URL: postgresql://bos_owner:bos_local_owner_password@localhost:5432/business_os_shadow?schema=public
      AUTH_DATABASE_URL: postgresql://bos_auth:bos_local_auth_password@localhost:5432/business_os?schema=public
      AUTH_SECRET: ci-only-auth-secret-not-used-anywhere-else-0123456789
      # Superuser connection used by integration tests for assertions only.
      TEST_ADMIN_URL: postgresql://postgres:ci_postgres_only@localhost:5432/business_os
      APP_BASE_URL: http://localhost:3000
      REGION: ci
      DATABASE_REGION: ci
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:1420,tauri://localhost,http://tauri.localhost
      VITE_API_BASE_URL: http://localhost:3000
      # RLS spike (data-model §5.4): direct admin/owner connections, and bos_app/bos_jobs through PgBouncer.
      SPIKE_ADMIN_URL: postgresql://postgres:ci_postgres_only@localhost:5432/business_os_spike
      SPIKE_OWNER_URL: postgresql://bos_owner:bos_local_owner_password@localhost:5432/business_os_spike
      SPIKE_APP_URL: postgresql://bos_app:bos_local_app_password@127.0.0.1:6433/business_os_spike
      SPIKE_APP_SINGLE_URL: postgresql://bos_app:bos_local_app_password@127.0.0.1:6433/spike_single
      SPIKE_JOBS_URL: postgresql://bos_jobs:bos_local_jobs_password@127.0.0.1:6433/business_os_spike
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: API contracts (JSON schema snapshot is current)
        run: pnpm contracts:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Boundaries (dependency-cruiser + source rules, incl. no database or server code in clients)
        run: pnpm boundaries

  unit:
    name: Unit, contract and architecture tests
    needs: changes
    if: needs.changes.outputs.gate_tier != 'docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env: *workspace-env
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Unit, contract and architecture tests
        run: pnpm test

  # CIQ-A2 (docs/ciq-1-merge-queue-throughput.md §4.A.3, decision D-CI-3): the integration suite runs in
  # three shards, each with its own PostgreSQL service, roles, migrations and privileged SQL, so no shard
  # shares database state with another. RLS isolation and every pooler suite run in their own job, and
  # `database-complete` proves the shards together ran every integration file exactly once.
  database:
    name: Database tests (integration shard ${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.gate_tier != 'docs' && needs.changes.outputs.gate_tier != 'client'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_DB: business_os
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d business_os"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env: *workspace-env
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Provision database roles (same script as local docker compose)
        run: psql "postgresql://postgres:ci_postgres_only@localhost:5432/business_os" -v ON_ERROR_STOP=1 -f docker/init/01-roles.sql
      - name: Apply migrations as the owner role
        run: pnpm --filter @business-os/api exec prisma migrate deploy
      - name: Apply privileged SQL (app_private functions) as an administrative role
        run: pnpm --filter @business-os/api db:privileged
        env:
          ADMIN_DATABASE_URL: ${{ env.TEST_ADMIN_URL }}
          DEPLOYMENT_REGION: ${{ env.REGION }}
      - name: Integration tests, shard ${{ matrix.shard }}/3 (API, RBAC, tenancy, PostgreSQL roles and isolation prerequisites)
        working-directory: apps/api
        run: >-
          pnpm exec vitest run --config vitest.integration.config.ts --shard=${{ matrix.shard }}/3
          --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/shard-${{ matrix.shard }}.json"
      # Uploaded even when tests fail, so the completeness job sees a failing report rather than none.
      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-integration-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 7

  database-pooler:
    name: Database tests (RLS isolation and pooler suites)
    needs: changes
    if: needs.changes.outputs.gate_tier != 'docs' && needs.changes.outputs.gate_tier != 'client'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_DB: business_os
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d business_os"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env: *workspace-env
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Provision database roles (same script as local docker compose)
        run: psql "postgresql://postgres:ci_postgres_only@localhost:5432/business_os" -v ON_ERROR_STOP=1 -f docker/init/01-roles.sql
      - name: Apply migrations as the owner role
        run: pnpm --filter @business-os/api exec prisma migrate deploy
      - name: Apply privileged SQL (app_private functions) as an administrative role
        run: pnpm --filter @business-os/api db:privileged
        env:
          ADMIN_DATABASE_URL: ${{ env.TEST_ADMIN_URL }}
          DEPLOYMENT_REGION: ${{ env.REGION }}
      # Cached .deb files from the signed Ubuntu archive, keyed by the pinned version and runner image.
      - name: PgBouncer cache key
        id: pgbouncer-key
        run: echo "key=pgbouncer-$PGBOUNCER_VERSION-$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Restore PgBouncer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pgbouncer-debs
          key: ${{ steps.pgbouncer-key.outputs.key }}
      - name: Start PgBouncer ${{ env.PGBOUNCER_VERSION }} in transaction mode (RLS spike pooler)
        run: |
          pgbouncer="$(PGBOUNCER_DEB_DIR="$HOME/.cache/pgbouncer-debs" .github/scripts/install-pgbouncer.sh)"
          cd docker/pgbouncer && "$pgbouncer" -d pgbouncer.ini
          for _ in $(seq 1 20); do pg_isready -h 127.0.0.1 -p 6433 && break; sleep 0.5; done
          pg_isready -h 127.0.0.1 -p 6433
      - name: RLS spike and isolation tests (S1-S13, behind the pooler)
        run: pnpm test:isolation
      # Finance F2/F3 (docs/finance-data-model.md §18.7, §19.10): the settlement, idempotency and lock-order
      # suites again, with bos_app through PgBouncer in transaction mode (the production pooling model).
      - name: Finance integrity, payments and expenses suites behind the pooler
        run: pnpm --filter @business-os/api exec vitest run --config vitest.integration.config.ts tests/integration/finance-integrity.test.ts tests/integration/finance-payments.test.ts tests/integration/finance-expenses.test.ts
        env:
          DATABASE_URL: postgresql://bos_app:bos_local_app_password@127.0.0.1:6433/business_os?schema=public
          FINANCE_TEST_IP_BLOCK: '82'
          FINANCE_TEST_IP_BLOCK_F3: '84'
      # People P1 (docs/people-data-model.md §2.2): reporting-line and termination races rely on a
      # transaction-scoped advisory lock, so the suite runs again behind the transaction-mode pooler.
      - name: People suite behind the pooler
        run: pnpm --filter @business-os/api exec vitest run --config vitest.integration.config.ts tests/integration/people.test.ts
        env:
          DATABASE_URL: postgresql://bos_app:bos_local_app_password@127.0.0.1:6433/business_os?schema=public
          PEOPLE_TEST_IP_BLOCK: '94'
      # People P3-A (docs/people-leave-p3.md §4.5): assignment, archive and termination races rely on row locks
      # (FOR SHARE / FOR UPDATE) inside one transaction, so the suite runs again behind the transaction-mode pooler.
      - name: People leave suite behind the pooler
        run: pnpm --filter @business-os/api exec vitest run --config vitest.integration.config.ts tests/integration/people-leave.test.ts
        env:
          DATABASE_URL: postgresql://bos_app:bos_local_app_password@127.0.0.1:6433/business_os?schema=public
          LEAVE_TEST_IP_BLOCK: '151'
      # Finance F6-1 (docs/finance-billing-f6.md §5): the billing worker's claims, leases and concurrent passes
      # again through the transaction-mode pooler.
      - name: Finance billing suite behind the pooler
        run: pnpm --filter @business-os/api exec vitest run --config vitest.integration.config.ts tests/integration/finance-billing.test.ts
        env:
          DATABASE_URL: postgresql://bos_app:bos_local_app_password@127.0.0.1:6433/business_os?schema=public
          BILLING_TEST_IP_BLOCK: '97'
      # Finance F6-3 (docs/finance-billing-f6.md §10): reminder claims, leases, the locked pre-dispatch check and
      # concurrent passes again through the transaction-mode pooler.
      - name: Finance reminders suite behind the pooler
        run: pnpm --filter @business-os/api exec vitest run --config vitest.integration.config.ts tests/integration/finance-reminders.test.ts
        env:
          DATABASE_URL: postgresql://bos_app:bos_local_app_password@127.0.0.1:6433/business_os?schema=public
          REMINDERS_TEST_IP_BLOCK: '131'
      - name: Scheduling resources suite behind the pooler
        run: pnpm --filter @business-os/api exec vitest run --config vitest.integration.config.ts tests/integration/scheduling-resources.test.ts
        env:
          DATABASE_URL: postgresql://bos_app:bos_local_app_password@127.0.0.1:6433/business_os?schema=public
          SCHEDULING_RESOURCES_TEST_IP_BLOCK: '92'
      # Administration A2-B (docs/administration-a2.md §13): last-owner, actor re-check, invitation and mailbox
      # cutoff races rely on transaction-scoped advisory and row locks, so the suite runs again behind the pooler.
      - name: Membership lifecycle suite behind the pooler
        run: pnpm --filter @business-os/api exec vitest run --config vitest.integration.config.ts tests/integration/membership-lifecycle.test.ts
        env:
          DATABASE_URL: postgresql://bos_app:bos_local_app_password@127.0.0.1:6433/business_os?schema=public
      - name: Migrations match schema
        run: pnpm db:check-migrations

  # Fails unless every integration file in the repository ran in exactly one shard and passed with at
  # least one test (.github/scripts/db-shard-completeness.sh). Runs even when a shard failed.
  database-complete:
    name: Database tests (shard completeness)
    needs: [changes, database]
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.gate_tier != 'docs' && needs.changes.outputs.gate_tier != 'client'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: db-integration-shard-*
          path: ${{ runner.temp }}/shards
          merge-multiple: true
        continue-on-error: true
      - name: Every integration file ran exactly once and passed
        run: |
          git ls-files -- 'apps/api/tests/integration/*.test.ts' > "$RUNNER_TEMP/expected-integration-files"
          .github/scripts/db-shard-completeness.sh "$RUNNER_TEMP/expected-integration-files" 3 "$RUNNER_TEMP/shards"

  build:
    name: Build verification (API, web, desktop frontend, startup, bundle security)
    needs: changes
    if: needs.changes.outputs.gate_tier != 'docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env: *workspace-env
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Build API, web app and desktop frontend
        run: pnpm build
      # The health route validates configuration only and never touches the database, so this job
      # needs no PostgreSQL service.
      - name: API boots and answers without owner credentials
        run: |
          cd apps/api
          env -i PATH="$PATH" HOME="$HOME" \
            DATABASE_URL="$DATABASE_URL" AUTH_DATABASE_URL="$AUTH_DATABASE_URL" AUTH_SECRET="$AUTH_SECRET" \
            APP_BASE_URL="$APP_BASE_URL" REGION="$REGION" \
            DATABASE_REGION="$DATABASE_REGION" CORS_ALLOWED_ORIGINS="$CORS_ALLOWED_ORIGINS" \
            pnpm start --port 3100 &
          for _ in $(seq 1 30); do curl -sf localhost:3100/api/v1/health && break; sleep 1; done
          curl -sf localhost:3100/api/v1/health | grep -q '"status":"ok"'
      - name: Client bundles contain no server configuration
        run: |
          if grep -rEl 'DATABASE_URL|postgres(ql)?://|bos_(app|owner|auth|jobs)|MIGRATION_|AUTH_SECRET' apps/web/dist apps/desktop/dist; then
            echo "Server configuration leaked into a client bundle" >&2
            exit 1
          fi

  # Native desktop build on all three platforms. Runs on every push to main or release branches,
  # tags, manual and scheduled runs, and on pull requests that touch desktop-affecting paths
  # (.github/scripts/classify-changes.sh).
  desktop:
    name: Desktop shell (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux (compile check), os: ubuntu-24.04, bundle: '--no-bundle' }
          - { name: macOS, os: macos-latest, bundle: '--bundles app' }
          - { name: Windows, os: windows-latest, bundle: '--bundles nsis' }
    env:
      # No API is deployed yet, so the shell reports "Not reachable"; the CSP allows only this origin.
      VITE_API_BASE_URL: https://api.business-os.invalid
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Linux WebKitGTK prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      # Key: job + OS + rustc version + Cargo.lock/Cargo.toml hashes (Swatinem/rust-cache). Only main
      # writes the cache, so pull requests always restore main's dependency build and never evict it.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Only the desktop app and the packages it uses: the desktop build never installs the API.
      - uses: ./.github/actions/setup-workspace
        with:
          filter: '@business-os/desktop...'
      # Unsigned verification build only. Code signing, notarisation and distribution are decided
      # before the first release (ADR 0005, open decisions); no artifacts are published.
      - name: Build the Tauri app (unsigned)
        run: pnpm --filter @business-os/desktop tauri:build ${{ matrix.bundle }}
      # Native sign-in code (D9a): URL allow-list, callback parsing, baked-in API origin.
      - name: Rust unit tests (desktop shell)
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

  # The single required status check. It runs even when jobs before it fail, are cancelled or are
  # skipped, and passes only if every applicable check succeeded. A skipped job satisfies it only when
  # the classifier succeeded and its explicit output permits that skip: the desktop matrix by the CI-2A
  # desktop decision, static/unit/build/database by the CIQ-A1 gate tier (.github/scripts/ci-gate.sh).
  gate:
    name: CI gate
    if: always()
    needs: [changes, static, unit, database, database-pooler, database-complete, build, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # job timings for the summary only; the verdict never depends on them
    env:
      CHANGES: ${{ needs.changes.result }}
      STATIC: ${{ needs.static.result }}
      UNIT: ${{ needs.unit.result }}
      DATABASE: ${{ needs.database.result }}
      DATABASE_POOLER: ${{ needs.database-pooler.result }}
      DATABASE_COMPLETE: ${{ needs.database-complete.result }}
      BUILD: ${{ needs.build.result }}
      DESKTOP: ${{ needs.desktop.result }}
      DESKTOP_REQUIRED: ${{ needs.changes.outputs.desktop }}
      DESKTOP_TIER: ${{ needs.changes.outputs.tier }}
      DESKTOP_REASON: ${{ needs.changes.outputs.desktop_reason }}
      GATE_TIER: ${{ needs.changes.outputs.gate_tier }}
      GATE_REASON: ${{ needs.changes.outputs.gate_reason }}
    steps:
      - name: Summary
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          jobs="$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs?per_page=100" || echo '{"jobs":[]}')"
          dur() { # job name prefix -> "1m 23s" (longest matching job, e.g. the slowest desktop OS)
            echo "$jobs" | jq -r --arg p "$1" '
              [.jobs[] | select(.name | startswith($p)) | select(.completed_at != null)
               | ((.completed_at | fromdate) - (.started_at | fromdate))] | max // empty
              | "\(. / 60 | floor)m \(. % 60)s"'
          }
          icon() { case "$1" in success) echo "✅";; skipped) echo "⏭️";; *) echo "❌";; esac; }
          {
            echo "## CI summary"
            echo
            echo "| Category | Result | Duration |"
            echo "|---|---|---|"
            echo "| Static checks (contracts, types, lint, boundaries) | $(icon "$STATIC") $STATIC | $(dur 'Static checks') |"
            echo "| Unit, contract and architecture tests | $(icon "$UNIT") $UNIT | $(dur 'Unit, contract') |"
            echo "| Database integration shards (roles, migrations, integration) | $(icon "$DATABASE") $DATABASE | $(dur 'Database tests (integration') (slowest shard) |"
            echo "| Database RLS isolation and pooler suites | $(icon "$DATABASE_POOLER") $DATABASE_POOLER | $(dur 'Database tests (RLS') |"
            echo "| Database shard completeness | $(icon "$DATABASE_COMPLETE") $DATABASE_COMPLETE | $(dur 'Database tests (shard') |"
            echo "| Build verification (API, web, desktop frontend, startup, bundles) | $(icon "$BUILD") $BUILD | $(dur 'Build verification') |"
            echo "| Desktop shell (Linux, macOS, Windows) | $(icon "$DESKTOP") $DESKTOP | $(dur 'Desktop shell') (slowest OS) |"
            echo
            echo "Gate tier: **${GATE_TIER:-unknown}** ($GATE_REASON)"
            echo
            echo "Desktop tier: **${DESKTOP_TIER:-unknown}**. Desktop matrix required: **${DESKTOP_REQUIRED:-unknown}** ($DESKTOP_REASON)"
            started="$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$ATTEMPT" --jq .run_started_at 2>/dev/null || true)"
            if [ -n "$started" ]; then
              total=$(( $(date +%s) - $(date -d "$started" +%s) ))
              echo
              echo "Total wall-clock time to this gate: **$((total / 60))m $((total % 60))s**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Require every applicable check
        run: .github/scripts/ci-gate.sh
