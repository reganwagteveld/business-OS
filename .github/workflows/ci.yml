name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Workspace checks (API, web, contracts, security)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_DB: business_os
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d business_os"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      # CI-only credentials, matching docker/init/01-roles.sql. Never used outside CI.
      # Server variables are read only by apps/api; the clients receive VITE_API_BASE_URL alone.
      DATABASE_URL: postgresql://bos_app:bos_local_app_password@localhost:5432/business_os?schema=public
      MIGRATION_DATABASE_URL: postgresql://bos_owner:bos_local_owner_password@localhost:5432/business_os?schema=public
      SHADOW_DATABASE_URL: postgresql://bos_owner:bos_local_owner_password@localhost:5432/business_os_shadow?schema=public
      AUTH_DATABASE_URL: postgresql://bos_auth:bos_local_auth_password@localhost:5432/business_os?schema=public
      AUTH_SECRET: ci-only-auth-secret-not-used-anywhere-else-0123456789
      # Superuser connection used by integration tests for assertions only.
      TEST_ADMIN_URL: postgresql://postgres:ci_postgres_only@localhost:5432/business_os
      APP_BASE_URL: http://localhost:3000
      REGION: ci
      DATABASE_REGION: ci
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:1420,tauri://localhost,http://tauri.localhost
      VITE_API_BASE_URL: http://localhost:3000
      # RLS spike (data-model §5.4): direct admin/owner connections, and bos_app/bos_jobs through PgBouncer.
      SPIKE_ADMIN_URL: postgresql://postgres:ci_postgres_only@localhost:5432/business_os_spike
      SPIKE_OWNER_URL: postgresql://bos_owner:bos_local_owner_password@localhost:5432/business_os_spike
      SPIKE_APP_URL: postgresql://bos_app:bos_local_app_password@127.0.0.1:6433/business_os_spike
      SPIKE_APP_SINGLE_URL: postgresql://bos_app:bos_local_app_password@127.0.0.1:6433/spike_single
      SPIKE_JOBS_URL: postgresql://bos_jobs:bos_local_jobs_password@127.0.0.1:6433/business_os_spike
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install (workspace lockfile must be up to date)
        run: pnpm install --frozen-lockfile
      - name: Provision database roles (same script as local docker compose)
        run: psql "postgresql://postgres:ci_postgres_only@localhost:5432/business_os" -v ON_ERROR_STOP=1 -f docker/init/01-roles.sql
      - name: API contracts (JSON schema snapshot is current)
        run: pnpm contracts:check
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Boundaries (dependency-cruiser + source rules, incl. no database or server code in clients)
        run: pnpm boundaries
      - name: Unit, contract and architecture tests
        run: pnpm test
      - name: Apply migrations as the owner role
        run: pnpm --filter @business-os/api exec prisma migrate deploy
      - name: Integration tests (PostgreSQL roles and isolation prerequisites)
        run: pnpm test:integration
      - name: Start PgBouncer in transaction mode (RLS spike pooler)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pgbouncer
          sudo systemctl stop pgbouncer || true
          pgbouncer --version
          cd docker/pgbouncer && pgbouncer -d pgbouncer.ini
          for i in $(seq 1 20); do pg_isready -h 127.0.0.1 -p 6433 && break; sleep 0.5; done
      - name: RLS spike and isolation tests (S1-S13, behind the pooler)
        run: pnpm test:isolation
      - name: Migrations match schema
        run: pnpm db:check-migrations
      - name: Build API, web app and desktop frontend
        run: pnpm build
      - name: API boots and answers without owner credentials
        run: |
          cd apps/api
          env -i PATH="$PATH" HOME="$HOME" \
            DATABASE_URL="$DATABASE_URL" AUTH_DATABASE_URL="$AUTH_DATABASE_URL" AUTH_SECRET="$AUTH_SECRET" \
            APP_BASE_URL="$APP_BASE_URL" REGION="$REGION" \
            DATABASE_REGION="$DATABASE_REGION" CORS_ALLOWED_ORIGINS="$CORS_ALLOWED_ORIGINS" \
            pnpm start --port 3100 &
          for i in $(seq 1 30); do curl -sf localhost:3100/api/v1/health && break; sleep 1; done
          curl -sf localhost:3100/api/v1/health | grep -q '"status":"ok"'
      - name: Client bundles contain no server configuration
        run: |
          if grep -rEl 'DATABASE_URL|postgres(ql)?://|bos_(app|owner|auth|jobs)|MIGRATION_|AUTH_SECRET' apps/web/dist apps/desktop/dist; then
            echo "Server configuration leaked into a client bundle" >&2
            exit 1
          fi

  desktop:
    name: Desktop shell (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux (compile check), os: ubuntu-24.04, bundle: '--no-bundle' }
          - { name: macOS, os: macos-latest, bundle: '--bundles app' }
          - { name: Windows, os: windows-latest, bundle: '--bundles nsis' }
    env:
      # No API is deployed yet, so the shell reports "Not reachable"; the CSP allows only this origin.
      VITE_API_BASE_URL: https://api.business-os.invalid
    steps:
      - uses: actions/checkout@v4
      - name: Linux WebKitGTK prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Only the desktop app and the packages it uses: the desktop build never installs the API.
      - run: pnpm install --frozen-lockfile --filter "@business-os/desktop..."
      # Unsigned verification build only. Code signing, notarisation and distribution are decided
      # before the first release (ADR 0005, open decisions); no artifacts are published.
      - name: Build the Tauri app (unsigned)
        run: pnpm --filter @business-os/desktop tauri:build ${{ matrix.bundle }}
